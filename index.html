<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Excel Web</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f3f2f1; display: flex; flex-direction: column; height: 100vh; }
    .top-bar { background: #217346; color: #fff; padding: 10px 15px; font-weight: bold; }
    .toolbar { background: #f8f9fa; border-bottom: 1px solid #ccc; padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { background: #fff; border: 1px solid #bbb; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
    button:active { background: #ddd; }
    input[type="color"] { width: 32px; height: 28px; border: 1px solid #bbb; padding: 0; cursor: pointer; }
    .formula-bar { display: flex; align-items: center; background: #fff; border-bottom: 1px solid #ccc; padding: 6px 8px; gap: 8px; }
    #cell-id { width: 50px; text-align: center; font-weight: bold; background: #eee; padding: 4px; border-radius: 3px; }
    #fx-input { flex: 1; border: 1px solid #ddd; padding: 5px; font-size: 14px; }
    .grid { overflow: auto; flex: 1; background: #fff; }
    table { border-collapse: collapse; table-layout: fixed; }
    th { background: #f1f1f1; color: #333; border: 1px solid #ccc; font-size: 12px; height: 26px; position: sticky; top: 0; z-index: 2; user-select: none; }
    th.row-num { width: 35px; left: 0; z-index: 3; }
    td { width: 110px; height: 28px; border: 1px solid #e0e0e0; padding: 4px; font-size: 14px; outline: none; overflow: hidden; white-space: nowrap; }
    td.selected { border: 2px solid #217346; }
  </style>
</head>
<body>

  <div class="top-bar">Excel Web</div>

  <div class="toolbar">
    <button onclick="styleCell('fontWeight', 'bold')"><b>G</b></button>
    <button onclick="styleCell('fontStyle', 'italic')"><i>I</i></button>
    <button onclick="styleCell('textDecoration', 'underline')"><u>S</u></button>
    <span>Fond:</span>
    <input type="color" value="#ffff00" onchange="colorCell('backgroundColor', this.value)">
    <span>Texte:</span>
    <input type="color" value="#ff0000" onchange="colorCell('color', this.value)">
    <button onclick="styleCell('textAlign', 'left')">Gauche</button>
    <button onclick="styleCell('textAlign', 'center')">Centre</button>
    <button onclick="styleCell('textAlign', 'right')">Droite</button>
    <button onclick="exportCSV()">Exporter CSV</button>
    <button onclick="clearAll()" style="color:red;">Effacer</button>
  </div>

  <div class="formula-bar">
    <div id="cell-id">E10</div>
    <b>fx</b>
    <input type="text" id="fx-input" placeholder="Valeur ou =SOMME(B2:B3)">
  </div>

  <div class="grid">
    <table id="sheet"></table>
  </div>

  <script>
    const ROWS = 25, COLS = 12;
    const sheet = document.getElementById('sheet');
    const fxInput = document.getElementById('fx-input');
    const cellIdBox = document.getElementById('cell-id');
    let activeCell = null;
    const data = {};

    function buildGrid() {
      let html = '<thead><tr><th class="row-num"></th>';
      for (let c = 0; c < COLS; c++) {
        html += '<th style="width:110px">' + String.fromCharCode(65 + c) + '</th>';
      }
      html += '</tr></thead><tbody>';

      for (let r = 1; r <= ROWS; r++) {
        html += '<tr><th class="row-num">' + r + '</th>';
        for (let c = 0; c < COLS; c++) {
          const id = String.fromCharCode(65 + c) + r;
          html += '<td id="' + id + '" contenteditable="true"></td>';
        }
        html += '</tr>';
      }
      html += '</tbody>';
      sheet.innerHTML = html;

      document.querySelectorAll('td').forEach(td => {
        td.addEventListener('focus', () => select(td));
        td.addEventListener('input', () => {
          data[td.id] = td.textContent;
          fxInput.value = td.textContent;
        });
        td.addEventListener('blur', calculate);
        td.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); td.blur(); }
        });
      });

      const centerCell = document.getElementById('E10');
      data['E10'] = 'Elouan est un hacker';
      centerCell.textContent = 'Elouan est un hacker';
      centerCell.style.color = '#ff0000';
      centerCell.style.fontWeight = 'bold';
      centerCell.style.textAlign = 'center';
      centerCell.style.overflow = 'visible';

      select(centerCell);
    }

    function select(td) {
      if (activeCell) activeCell.classList.remove('selected');
      activeCell = td;
      td.classList.add('selected');
      cellIdBox.textContent = td.id;
      fxInput.value = data[td.id] || '';
    }

    fxInput.addEventListener('input', () => {
      if (activeCell) {
        data[activeCell.id] = fxInput.value;
        activeCell.textContent = fxInput.value;
      }
    });

    fxInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && activeCell) {
        calculate();
        activeCell.focus();
      }
    });

    function calculate() {
      for (const id in data) {
        const raw = data[id] || '';
        const td = document.getElementById(id);
        if (raw.startsWith('=')) {
          td.textContent = runFormula(raw.slice(1).toUpperCase());
        } else {
          td.textContent = raw;
        }
      }
    }

    function runFormula(expr) {
      try {
        expr = expr.replace(/(SOMME|MOYENNE)\(([A-Z]+\d+):([A-Z]+\d+)\)/g, (_, fn, a, b) => {
          const vals = getRange(a, b);
          const sum = vals.reduce((x, y) => x + y, 0);
          return fn === 'SOMME' ? sum : (vals.length ? sum / vals.length : 0);
        });
        expr = expr.replace(/[A-Z]+\d+/g, ref => {
          const n = parseFloat(document.getElementById(ref)?.textContent);
          return isNaN(n) ? 0 : n;
        });
        return Function('return (' + expr + ')')();
      } catch (e) {
        return '#ERREUR';
      }
    }

    function getRange(start, end) {
      const c1 = start.charCodeAt(0), r1 = parseInt(start.slice(1));
      const c2 = end.charCodeAt(0), r2 = parseInt(end.slice(1));
      const res = [];
      for (let c = c1; c <= c2; c++) {
        for (let r = r1; r <= r2; r++) {
          const n = parseFloat(document.getElementById(String.fromCharCode(c) + r)?.textContent);
          if (!isNaN(n)) res.push(n);
        }
      }
      return res;
    }

    function styleCell(prop, val) {
      if (!activeCell) return;
      activeCell.style[prop] = activeCell.style[prop] === val ? '' : val;
    }

    function colorCell(prop, val) {
      if (!activeCell) return;
      activeCell.style[prop] = val;
    }

    function clearAll() {
      if (!confirm('Tout effacer ?')) return;
      for (const k in data) delete data[k];
      document.querySelectorAll('td').forEach(td => {
        td.textContent = '';
        td.removeAttribute('style');
      });
      fxInput.value = '';
    }

    function exportCSV() {
      const lines = [];
      for (let r = 1; r <= ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          const txt = document.getElementById(String.fromCharCode(65 + c) + r).textContent;
          row.push(txt.replace(/;/g, ','));
        }
        lines.push(row.join(';'));
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tableau.csv';
      a.click();
    }

    buildGrid();
  </script>
</body>
</html>
